[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = ".netlify/functions-internal"
  node_bundler = "none"

# Platform install assets are not part of the published site.
[[redirects]]
  from = "/__grok/*"
  to = "/favicon.svg"
  status = 404
